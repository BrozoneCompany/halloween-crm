<!DOCTYPE html>
<html lang="uk">
<head>

  <title>Halloween CRM & Guest Management</title>

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  </style>

<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 bg-slate-800/80 p-6 rounded-2xl border border-slate-700/50 shadow-xl backdrop-blur-sm">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-orange-500/20 border border-orange-500/30 flex items-center justify-center text-orange-400 text-2xl shadow-inner">
          🎃
        </div>
        <div>
          <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
            HALLOWEEN CRM <span class="text-xs px-2 py-0.5 rounded-full bg-orange-500/20 text-orange-400 border border-orange-500/30 font-semibold">2026</span>
          </h1>
          <p class="text-xs text-slate-400">Система управління списками та фінансами події</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <button onclick="toggleExpandedRoster()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold text-sm transition flex items-center gap-2 shadow-lg shadow-indigo-600/20">
          <i class="fa-solid fa-list-check"></i> Таблиця всіх гостей
        </button>
        <button onclick="openAddGuestModal()" class="px-4 py-2 bg-orange-500 hover:bg-orange-400 text-white rounded-xl font-semibold text-sm transition flex items-center gap-2 shadow-lg shadow-orange-500/20">
          <i class="fa-solid fa-user-plus"></i> Додати гостя
        </button>
      </div>
    </header>

    <!-- Stats Dashboard -->
    <div id="statsContainer" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>

    <!-- Controls & Filters -->
    <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50 mb-6 flex flex-col md:flex-row justify-between gap-4">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="renderApp()" placeholder="Пошук за ім'ям, Instagram або приміткою..." class="w-full pl-11 pr-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-orange-500 text-slate-200 placeholder-slate-500 transition">
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="setCategoryFilter('all')" id="btnFilterAll" class="px-3.5 py-2 text-xs font-semibold rounded-xl border transition">Усі</button>
        <button onclick="setCategoryFilter('Main')" id="btnFilterMain" class="px-3.5 py-2 text-xs font-semibold rounded-xl border transition">🎉 Основні</button>
        <button onclick="setCategoryFilter('Staff')" id="btnFilterStaff" class="px-3.5 py-2 text-xs font-semibold rounded-xl border transition">💼 Персонал</button>
        <button onclick="setCategoryFilter('VIP')" id="btnFilterVIP" class="px-3.5 py-2 text-xs font-semibold rounded-xl border transition">⭐ VIP</button>
      </div>
    </div>

    <!-- Cards List View -->
    <div id="cardsView" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <!-- Expanded Full Roster Modal -->
    <div id="rosterModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">

            </h2>
            <p class="text-xs text-slate-400">Повний перелік з деталями, контактами та статусами</p>

            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>
        <div class="p-4 bg-slate-950/40 border-b border-slate-800/80 flex flex-wrap gap-3 items-center justify-between">

        </div>
        <div class="flex-1 overflow-auto p-6">

            <thead>

                <th class="p-3">Гость / ФІО</th>
                <th class="p-3">Категорія</th>
                <th class="p-3">Стать</th>
                <th class="p-3">Супровід (+1)</th>
                <th class="p-3">Instagram / Контакт</th>

              </tr>
            </thead>
            <tbody id="rosterTableBody" class="divide-y divide-slate-800/50 text-slate-300"></tbody>

        </div>
      </div>
    </div>

    <!-- Add Guest Modal -->

        <form onsubmit="handleAddGuest(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Ім'я та Прізвище *</label>
            <input type="text" id="newGuestName" required class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-orange-500">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Категорія</label>
              <select id="newGuestCategory" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-100">
                <option value="Main">Основний гость</option>
                <option value="Staff">Персонал</option>
                <option value="VIP">VIP / Орг</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Стать</label>
              <select id="newGuestGender" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-100">
                <option value="M">Чоловік</option>
                <option value="F">Жінка</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Instagram або Телефон *</label>
            <input type="text" id="newGuestContact" required placeholder="https://instagram.com/ник або телефон" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-orange-500">

            <button type="submit" class="px-4 py-2 bg-orange-500 hover:bg-orange-400 text-white rounded-xl text-xs font-semibold">Зберегти</button>
          </div>
        </form>

      });

    function calculateStats() {
      let totalPax = 0;
      let payingPax = 0;
      let vipPax = 0;
      let collectedPLN = 0;
      let checkedInCount = 0;

      guests.forEach(g => {
        const count = 1 + g.companions.length;
        totalPax += count;
        if (g.isVip) {
          vipPax += count;
        } else {
          payingPax += count;
          if (g.isPaid) collectedPLN += count * 100;
        }
        if (g.checkedIn) checkedInCount += count;
      });
